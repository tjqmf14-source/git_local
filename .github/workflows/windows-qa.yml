name: Windows QA

on:
  push:
    branches:
      - main
      - dev/v1-universal-sync
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Git version
        shell: powershell
        run: git --version

      - name: Core end-to-end QA (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\Run-Tests.ps1

      - name: UI construction smoke test
        shell: powershell
        run: .\src\GitLocal.App.ps1 -SelfTest

      - name: Build portable EXE package
        shell: powershell
        run: .\packaging\Build-Package.ps1

      - name: Verify package outputs
        shell: powershell
        run: |
          $zip = @(Get-ChildItem .\dist\GitLocal-*-win-x64.zip)
          $sha = @(Get-ChildItem .\dist\GitLocal-*-win-x64.sha256.txt)
          if ($zip.Count -ne 1 -or $sha.Count -ne 1) { throw 'Expected package outputs were not generated.' }
          Get-Content $sha[0].FullName

      - name: Upload QA package
        uses: actions/upload-artifact@v4
        with:
          name: GitLocal-windows-package
          path: |
            dist/GitLocal-*-win-x64.zip
            dist/GitLocal-*-win-x64.sha256.txt
          if-no-files-found: error
          retention-days: 14
